<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShowOnce | Repair evidence</title>
<style>body{background:#0b1019;color:#e5edf8;font:16px/1.6 system-ui;margin:0}main{max-width:1000px;margin:auto;padding:48px 24px}h1{font-size:48px;letter-spacing:-2px}p{color:#a3b5ce}button{background:#9be5bb;border:0;border-radius:9px;padding:14px 20px;font-weight:700;cursor:pointer}article{background:#131e2e;border:1px solid #2b3d55;border-radius:12px;margin:15px 0;padding:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}small{color:#9be5bb}button:disabled{opacity:.6}</style>
<main><small>SHOWONCE / RECOVERY CONTROL ROOM</small><h1>A failed fix.<br>A verified recovery.</h1><p>Run an isolated sample repository. Inspect a wrong patch failing independent tests, its failure context, and a verified second repair.</p><p>Offline fixture · deterministic repair · local checkpoint · no external messages</p><button id="run">Run repair fixture</button><p id="status" role="status"></p><section id="events"></section></main>
<script>document.querySelector('#run').onclick=async function(){this.disabled=true;const status=document.querySelector('#status'),events=document.querySelector('#events');events.replaceChildren();status.textContent='Running isolated tests…';try{const response=await fetch('/run',{method:'POST'});if(!response.ok)throw Error('Run failed');const result=await response.json();for(const event of result.events){const card=document.createElement('article'),title=document.createElement('h2'),detail=document.createElement('pre');title.textContent=event.name;detail.textContent=JSON.stringify(event.data,null,2);card.append(title,detail);events.append(card)}status.textContent=`${result.solved?'Verified recovery':'Unresolved'} · ${result.retries} retry · ${result.latency_ms} ms`}catch(error){status.textContent=error.message}finally{this.disabled=false}};</script></html>
